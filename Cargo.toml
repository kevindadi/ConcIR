[package]
name = "concir"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
unipn = { git = "https://github.com/kevindadi/UniPN", rev = "b57297c9d5738eb4061a8a45acb8be97760db3d1", default-features = false }
unipn-transfer = { git = "https://github.com/kevindadi/UniPN", rev = "b57297c9d5738eb4061a8a45acb8be97760db3d1" }

[[bin]]
name = "concir-instrument"
path = "src/bin/instrument.rs"

[dev-dependencies]
insta = "1"
